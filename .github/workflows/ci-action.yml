# ci.yml answers "is the code green"; this answers "is the distribution channel
# green". The action can be broken while every test passes — a bad cache key, a
# `hashFiles()` that cannot see outside the workspace, an input that never
# reaches the script — and none of that is visible to `cargo test`.
#
# The sample package stands in for a user's package: e2e/micro depends on Lean
# core only, so this costs an elan download and seconds of Lean, not Mathlib.
name: action (self-test)

on:
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "tools/ci-build.sh"
      - ".github/workflows/ci-action.yml"
  pull_request:
    paths:
      - "action.yml"
      - "tools/ci-build.sh"
      - ".github/workflows/ci-action.yml"
  workflow_dispatch:

concurrency:
  # A superseded run holds slots against the 20-job concurrency limit while
  # telling us nothing about HEAD.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  local:
    name: the action builds a site, twice
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # elan up front so the toolchain download is cached across runs. The
      # action would install it itself; `standalone` below is where that path
      # is exercised.
      - uses: ./.github/actions/setup-elan

      # `full: true` so this job does not depend on what the state cache happens
      # to hold. Without it the first call can legitimately render 0 pages — a
      # previous run's state is restored and there is nothing left to do — and
      # then "the first run rendered nothing" is a property of the cache, not of
      # the action (measured). It also skips the state restore, so the pair below
      # is first=everything, second=nothing, every time.
      - id: docs
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"
          full: "true"

      - name: The outputs point at something real
        run: |
          set -euo pipefail
          SITE="${{ steps.docs.outputs.site }}"
          echo "site = $SITE"
          test -d "$SITE" || { echo "::error::outputs.site is not a directory"; exit 1; }
          test -f "$SITE/index.html" || { echo "::error::no index.html"; exit 1; }
          echo "pages: $(find "$SITE" -name '*.html' | wc -l)"
          cat "${{ steps.docs.outputs.timings }}"
          # A first run that renders nothing would satisfy every check below,
          # so it is asserted here rather than assumed.
          python3 - "${{ steps.docs.outputs.out }}/litedoc4-build.json" <<'PY'
          import json, sys
          w = json.load(open(sys.argv[1]))["work"]
          if not w.get("pagesRendered"):
              print(f"::error::the first run rendered no pages: {w}")
              sys.exit(1)
          print(f"first run rendered {w['pagesRendered']} pages")
          PY

      # The second run is the claim the whole tool is built on: same inputs,
      # same --out, nothing re-rendered.
      - id: again
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"

      # `work` in litedoc4-build.json counts what the product did in integers
      # rather than seconds. Gate on those: wall clock moves 5x with the page
      # cache.
      - name: The second run did no work
        run: |
          set -euo pipefail
          J="${{ steps.again.outputs.out }}/litedoc4-build.json"
          cat "$J"
          python3 - "$J" <<'PY'
          import json, sys
          w = json.load(open(sys.argv[1]))["work"]
          bad = {k: w.get(k) for k in ("modulesExtracted", "pagesRendered") if w.get(k, -1) != 0}
          if bad:
              print("::error::a rebuild with nothing changed did work: " +
                    ", ".join(f"{k}={v}" for k, v in bad.items()))
              sys.exit(1)
          print("no-op rebuild: extracted 0, rendered 0")
          PY

  standalone:
    name: the action installs elan itself
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Nothing in ~/.elan to start with
        run: test ! -d "$HOME/.elan" && echo "clean"
      - id: docs
        uses: ./
        with:
          root: e2e/micro
          jobs: "2"
      - run: test -f "${{ steps.docs.outputs.site }}/index.html"

  refused:
    name: a package that does not exist fails
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - id: attempt
        continue-on-error: true
        uses: ./
        with:
          root: this-package-does-not-exist
      - name: It must have failed
        run: |
          if [ "${{ steps.attempt.outcome }}" != "failure" ]; then
            echo "::error::the action accepted a package that is not there"
            exit 1
          fi
          echo "refused, as it should"

  # `uses: FujiHaruka/litedoc4@main` goes through the path GitHub really takes
  # (checking the action out into _actions/), which `uses: ./` never exercises.
  # `@main` and not this commit, because `uses:` cannot take an expression — so
  # it grades the channel, not this diff.
  published:
    name: uses:FujiHaruka/litedoc4@main (the real checkout path)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Only from this repository's own branches: a fork's PR would resolve @main
    # to this repository anyway, which tells the fork nothing.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      - id: docs
        uses: FujiHaruka/litedoc4@main
        with:
          root: e2e/micro
          jobs: "2"

      - run: test -f "${{ steps.docs.outputs.site }}/index.html"

  # The one path the jobs above never take: `@main` has no release, so they all
  # fall back to cargo. This pins a tag so the download actually happens, and
  # asserts on `binary-source` rather than on the log — "it worked" is not
  # evidence that it worked *that way*. On demand only, and the pin goes stale
  # by design: move it (and README's) when a release is cut.
  released:
    name: uses:@v1.2.0 — the released binary, not a cargo build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-elan

      - id: docs
        uses: FujiHaruka/litedoc4@v1.2.0
        with:
          root: e2e/micro
          jobs: "2"

      - name: It came from the release
        run: |
          SRC="${{ steps.docs.outputs.binary-source }}"
          echo "binary-source = $SRC"
          test "$SRC" = "release" || {
            echo "::error::expected the released binary, got '$SRC' — the download path did not run"
            exit 1; }
          test -f "${{ steps.docs.outputs.site }}/index.html"
