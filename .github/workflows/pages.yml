# The sample site, rebuilt from HEAD.
#
# The other live site — the Mathlib-dependent package in the README — is
# published by *that* repository when it releases, so it shows whichever litedoc4
# it pinned. This one shows what this commit produces, which is the question a
# reader looking at a change actually has.
#
# It publishes `e2e/micro`, the eleven-module sample package: scoped notation, an
# astral identifier, a formula the converter refuses, `class inductive`, the
# three shapes of `sorry`. **Its docstrings and `docs/index.md` are this site's
# copy** — strangers read them, so they are written for a stranger, and the
# reasons a declaration is there live in comments the site never shows.
#
# `tools/e2e-micro.sh` runs first and the deployment is downstream of it, so a
# site that failed its own gates is never the one being served.
name: sample site

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "csrc/**"
      - "vendor/**"
      - "lakefile.lean"
      - "extractor/**"
      - "e2e/micro/**"
      - "e2e/micro-dep/**"
      - "tools/build-lean-exe.sh"
      - "tools/e2e-micro.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued, not cancelled: a deployment killed halfway leaves Pages serving a tree
# nobody chose.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      # **The published sample is built by the half that is actually
      # distributed.** A consumer gets `lean_exe litedoc4` and nothing else, so a
      # sample built by the Rust binary would be a site nobody can reproduce from
      # what they installed — and the asymmetry would be invisible, because the
      # two halves write the same bytes (M8, measured over the whole target).
      - name: Cache the litedoc4 build
        uses: actions/cache@v6
        with:
          path: .lake
          key: litedoc4-lean-${{ runner.os }}-pages-${{ hashFiles('lakefile.lean', 'src/**', 'csrc/**', 'vendor/**', 'e2e/micro/lean-toolchain') }}
          restore-keys: litedoc4-lean-${{ runner.os }}-pages-

      - name: Build litedoc4
        run: tools/build-lean-exe.sh --toolchain-from e2e/micro

      - name: Build the site, through every gate
        env:
          LITEDOC4: ${{ github.workspace }}/.lake/build/bin/litedoc4
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/e2e/first/site

      - id: deployment
        uses: actions/deploy-pages@v5
