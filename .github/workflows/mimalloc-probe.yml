# A measurement, not a gate: its numbers go to benchmarks/results/.
name: mimalloc huge-block probe

on:
  push:
    branches: [multi-version]
    paths:
      - ".github/workflows/mimalloc-probe.yml"
      - "benchmarks/tools/mimalloc-huge-probe.lean"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: the probe on each toolchain
        run: |
          grep -m1 'model name' /proc/cpuinfo
          for tc in v4.31.0 v4.33.1 v4.34.1; do
            elan toolchain install "leanprover/lean4:$tc" >/dev/null 2>&1
            dir="$HOME/.elan/toolchains/leanprover--lean4---$tc"
            echo "== $tc $(grep -o 'MI_MALLOC_VERSION [0-9]*' "$dir/include/lean/mimalloc.h")"
            work="$RUNNER_TEMP/probe-$tc"
            mkdir -p "$work"
            "$dir/bin/lean" -c "$work/probe.c" benchmarks/tools/mimalloc-huge-probe.lean
            "$dir/bin/leanc" "$work/probe.c" -o "$work/probe"
            for mib in 40 66 128; do "$work/probe" "$mib"; done
          done
