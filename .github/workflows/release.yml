# Only the Rust binary is shipped. The Lean extractor is 171 MB against this
# binary's 2.5 MB, and building it takes ~16 s against cargo's ~24 s (measured):
# shipping the small one removes a 24 s build and a several-hundred-MB cargo
# cache from every user's CI, while shipping the large one would trade a 16 s
# build for a 46 MB download and a matrix that multiplies by toolchain. Whether
# it could be shipped at all is ci-extractor-portability.yml's question.
#
# The archive is `litedoc4` + `LICENSE` + `NOTICE`, not just the binary: a
# binary release is Apache-2.0 §4's "Object form", which triggers (a), and md4c
# is compiled in under MIT, whose permission notice must travel with "all
# copies". NOTICE carries md4c's full text rather than pointing at
# vendor/md4c/LICENSE.md, which is not in the archive. docs/provenance.md §4 is
# the record.
#
# The smoke job builds a whole site because `--version` proves the file is
# executable, not that it is correct: a musl build with a broken md4c link
# passes it and then produces documentation with no rendered markdown.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "build and verify the archives without publishing"
        type: boolean
        default: true

concurrency:
  # Never cancelled: `publish` uploads release assets, and a run killed between
  # two uploads leaves a half-populated release behind.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl so that the glibc version of the runner image stops being a
          # thing anyone has to think about.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Native, not cross: `ubuntu-24.04-arm` is a real arm64 runner (4 vCPU,
          # 15 GiB), so the vendored C is compiled by an arm musl-gcc and the
          # binary is executed by the smoke job below. No cross toolchain is
          # involved (measured 2026-08-29,
          # benchmarks/results/arm64-linux-runner-2026-08-29.txt).
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # No x86_64-apple-darwin: it needs an Intel runner to be *tested* on,
          # and `macos-13` does not start here (measured 2026-08-18: queued >15 min
          # without ever starting). Cross-compiling from the arm runner would
          # produce a binary nobody had executed — the "it built, therefore it
          # works" the smoke job below exists to refuse. Intel macOS builds from
          # source.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - name: Install the toolchain rust-toolchain.toml asks for
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      # cc-rs picks musl-gcc up from PATH, but only if it is there: without
      # this, vendored md4c is compiled by the host gcc and the link fails late,
      # after cargo has already spent minutes on the Rust half.
      - name: musl toolchain for the vendored C
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --bin litedoc4 --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      # A musl target that came out dynamically linked defeats the point of
      # choosing musl, and it is invisible until it runs on a machine with a
      # different libc.
      - name: It is what it claims to be
        run: |
          BIN=target/${{ matrix.target }}/release/litedoc4
          ls -l "$BIN"
          file "$BIN"
          # Every musl target, not one named triple: the check that names its
          # target only ever grades the target somebody remembered to name.
          case "${{ matrix.target }}" in
            *-linux-musl)
              # The test is "did ldd resolve any shared object", i.e. does its
              # output contain `=>`. **Not** the wording: a static binary makes
              # ldd say "not a dynamic executable" on some systems and
              # "statically linked" on others, and the first version of this
              # check failed the build over that difference rather than over
              # anything about the binary.
              if ldd "$BIN" 2>&1 | grep -q "=>"; then
                echo "::error::expected a static binary, but ldd resolved shared objects"
                ldd "$BIN" || true
                exit 1
              fi
              echo "statically linked — ldd resolved nothing:"
              ldd "$BIN" 2>&1 || true
              ;;
          esac

      - name: Work out the version
        id: v
        shell: bash
        run: |
          # A tag is authoritative when there is one; otherwise the workspace
          # version, so a dry run produces the same names a release would.
          W="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"
          else V="$W"; fi
          # **A tag that disagrees with the workspace version publishes an inert
          # release.** `lakefile.lean`'s `resolveLitedoc4` looks a binary up by
          # the version in the *required tree's* `Cargo.toml`, so assets under
          # any other number are a URL nobody asks for: the consumer announces
          # "no asset for this version" and falls through to `cargo build`.
          # Nothing breaks loudly, which is why this has to be checked here —
          # it is the same defect as shipping a v0.1.4 binary to a tree whose
          # extractor writes a newer IR schema, one step upstream.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$V" != "$W" ]; then
            echo "::error::tag v$V does not match [workspace.package] version $W in Cargo.toml." \
                 "The assets would publish under $V while every consumer asks for v$W," \
                 "so the release would be inert. Move the version, or move the tag." >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # **The asset name carries no version.** That is what makes
          #   releases/latest/download/litedoc4-<target>.tar.gz
          # a URL that keeps working, which is the whole install instruction in
          # README. The version is inside, in the directory it unpacks to, so
          # two downloads still do not collide on disk.
          echo "asset=litedoc4-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "dir=litedoc4-$V-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Archive
        shell: bash
        run: |
          DIR="${{ steps.v.outputs.dir }}"
          mkdir -p "dist/$DIR"
          cp "target/${{ matrix.target }}/release/litedoc4" "dist/$DIR/"
          cp LICENSE NOTICE "dist/$DIR/"
          tar -C dist -czf "dist/${{ steps.v.outputs.asset }}.tar.gz" "$DIR"
          rm -rf "dist/$DIR"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.asset }}
          path: dist/*.tar.gz
          retention-days: 7

  # On a runner that never built the archive, and on the architecture the
  # archive is for: a binary executed only by the machine that produced it has
  # not been executed by anyone the release is for.
  smoke:
    name: smoke — ${{ matrix.target }} builds a site
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # `*x86_64-…` and `*aarch64-…` each match exactly one artifact: neither
      # architecture's spelling occurs inside the other's.
      - uses: actions/download-artifact@v8
        with:
          pattern: "*${{ matrix.target }}"
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      - name: Unpack exactly what a user would download
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          tar xzf *.tar.gz
          find . -maxdepth 2 -type f | sort
          # The licence files are an obligation, not decoration: fail if the
          # archive ever stops carrying them.
          test -f */LICENSE || { echo "no LICENSE in the archive" >&2; exit 1; }
          test -f */NOTICE  || { echo "no NOTICE in the archive"  >&2; exit 1; }
          grep -q "Martin Mit" */NOTICE || { echo "NOTICE lost md4c's MIT text" >&2; exit 1; }

      - uses: ./.github/actions/setup-elan

      # LITEDOC4 points e2e-micro.sh at the unpacked binary instead of a cargo
      # build, so what is measured is the artifact, not this checkout.
      - name: End to end with the downloaded binary
        run: |
          BIN="$(find "$RUNNER_TEMP/dl" -name litedoc4 -type f | head -1)"
          chmod +x "$BIN"
          "$BIN" --version || true
          LITEDOC4="$BIN" tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

  # **Renders on a dry run too**, which is the whole reason it is a job and not a
  # step inside `publish`: `publish` is skipped unless the ref is a tag, so the
  # notes would otherwise be rendered for the first time by the release itself,
  # in the one run where a failure is expensive.
  #
  # The version is `Cargo.toml`'s, with no second copy of "a tag wins": `build`
  # has already failed the run if the tag and the workspace version disagree, so
  # by the time this job starts there is only one number.
  notes:
    name: the notes this release ships with
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Substitute the version
        run: |
          set -euo pipefail
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          mkdir -p "$RUNNER_TEMP/notes"
          sed "s/@VERSION@/$V/g" .github/release-notes.md > "$RUNNER_TEMP/notes/notes.md"
          # A placeholder that survived would publish `@VERSION@` as the thing to
          # pin, on a page nobody re-reads after the release is out.
          if grep -q '@VERSION@' "$RUNNER_TEMP/notes/notes.md"; then
            echo "::error::a @VERSION@ placeholder survived substitution in the release notes"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes/notes.md"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/notes.md
          retention-days: 7

  publish:
    name: publish
    needs: [build, smoke, notes]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # `pattern`, so that the notes artifact does not land among the things
      # `sha256sum *.tar.gz` and `gh release create ./*.tar.gz` glob over.
      - uses: actions/download-artifact@v8
        with:
          pattern: "litedoc4-*"
          path: ${{ runner.temp }}/dl
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes

      - name: Checksums
        run: |
          cd "$RUNNER_TEMP/dl"
          ls -l
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      # `--repo` on every call: this runs from $RUNNER_TEMP/dl, which is not a
      # git repository, and `gh` works out the repository from the checkout it
      # is standing in. Without it the step dies with "fatal: not a git
      # repository" after everything else has already succeeded.
      # **A tracked file, not `--generate-notes`.** A generated list of commit
      # subjects is process, which is the one thing user-facing documentation in
      # this repository does not carry — so every release before this one had its
      # notes replaced by hand afterwards, which is a step that gets forgotten
      # rather than a design. `tools/release-notes-gate.sh` reconciles what the
      # file claims against the assets this workflow asserts and against
      # `tools/lean-toolchains.txt`.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          N: ${{ runner.temp }}/notes/notes.md
        run: |
          cd "$RUNNER_TEMP/dl"
          # Both paths set the notes: a re-run over an existing release exists to
          # make the release match the tree, and notes that stayed as the first
          # run left them would be the half it silently did not fix.
          if gh release view "$GITHUB_REF_NAME" --repo "$R" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tar.gz checksums.txt --clobber --repo "$R"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$N" --repo "$R"
          else
            gh release create "$GITHUB_REF_NAME" ./*.tar.gz checksums.txt \
              --title "$GITHUB_REF_NAME" --notes-file "$N" --repo "$R"
          fi

      # "The command exited 0" is not "the assets are on the release". Ask.
      - name: The release actually carries the assets
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAMES="$(gh release view "$GITHUB_REF_NAME" --repo "$R" --json assets --jq '.assets[].name' | sort)"
          echo "$NAMES"
          for want in litedoc4-x86_64-unknown-linux-musl.tar.gz \
                      litedoc4-aarch64-unknown-linux-musl.tar.gz \
                      litedoc4-aarch64-apple-darwin.tar.gz \
                      checksums.txt; do
            echo "$NAMES" | grep -qx "$want" || { echo "::error::missing asset: $want"; exit 1; }
          done
