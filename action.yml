# litedoc4 as a GitHub Action.
#
# ============================================================================
# WHAT THIS REPLACES
# ============================================================================
#   Before this file, using litedoc4 in CI meant copying ~30 lines of YAML out
#   of README.md: a second `actions/checkout` for this repository, three cache
#   blocks whose keys you had to get right, an elan install, and a call into
#   tools/ci-build.sh. All of that is here now, and the caller writes:
#
#       - uses: FujiHaruka/litedoc4@v1.3.0
#         id: docs
#       - uses: actions/upload-pages-artifact@v5
#         with: { path: "${{ steps.docs.outputs.site }}" }
#
#   Publishing is deliberately NOT here. Where the site goes is the caller's
#   decision, and an action that uploads to Pages cannot be used by anyone who
#   wants an artifact, a commit to gh-pages, or a copy on S3.
#
# ============================================================================
# WHY THE CACHE KEYS ARE COMPUTED BY HAND
# ============================================================================
#   `hashFiles()` can only read inside GITHUB_WORKSPACE. This action's own
#   sources live under $GITHUB_ACTION_PATH, which is outside it — so a key
#   spelled `hashFiles('litedoc4/...')` (correct when the caller checked this
#   repository out into the workspace) cannot be written any more.
#   `github.action_ref` looks like a replacement and is not: pinned to a tag it
#   works, and `@main` freezes the key while the sources move underneath it.
#   So the `keys` step hashes the files itself. It is the only correct option
#   that does not depend on how the action was referenced.
#
# ============================================================================
# WHAT IS BORROWED AND WHAT IS BUILT
# ============================================================================
#   Both executables are built here, from this tree, against the caller's
#   toolchain: the extractor (`extractor/Extract.lean`, cached on toolchain +
#   Extract.lean) and `litedoc4` itself (`src/`, cached on toolchain + the Lean
#   and C sources). Nothing is downloaded and there is no second toolchain to
#   install — a caller brings elan and nothing else. The extractor in particular
#   cannot be shipped prebuilt without the evidence in
#   .github/workflows/ci-extractor-portability.yml.
name: litedoc4
description: Fast HTML documentation for Lean 4 packages, built for the ones standing on Mathlib
author: FujiHaruka

branding:
  icon: book-open
  color: purple

inputs:
  root:
    description: "the Lean package to document, relative to the workspace (or absolute)"
    default: "."
  out:
    description: "where the documentation state goes; <out>/site is the site. Must be outside root. Default: a directory under RUNNER_TEMP"
    default: ""
  cache-get:
    description: "run `lake exe cache get` first — you want this for a Mathlib-dependent package"
    default: "false"
  lake-build:
    description: "run `lake build` in the same job. Turn off only if the package was already built in THIS job — from another job the page cache is cold and the extractor is 5-12x slower"
    default: "true"
  jobs:
    description: "extractor threads"
    default: "4"
  lib:
    description: "library name, when it cannot be read from lakefile.toml (needed for lakefile.lean)"
    default: ""
  source-url:
    description: "base URL for source links, when `origin` is not GitHub"
    default: ""
  full:
    description: "ignore any previous state under out and regenerate everything"
    default: "false"
  install-elan:
    description: "install elan if `lake` is not already on PATH"
    default: "true"
  cache:
    description: "use actions/cache for the extractor, the litedoc4 build, Mathlib's oleans and the incremental state"
    default: "true"

outputs:
  site:
    description: "the generated site — hand this to upload-pages-artifact or upload-artifact"
    value: "${{ steps.build.outputs.site }}"
  out:
    description: "the state directory (site + caches). Keep it between runs to stay incremental"
    value: "${{ steps.build.outputs.out }}"
  timings:
    description: "path to the phase timings JSON"
    value: "${{ steps.build.outputs.timings }}"
  # Constant, and kept rather than dropped: it is a name 1.x promised, and a
  # workflow that reads a *removed* output gets an empty string with no error,
  # so removing it would turn somebody's `test "$SRC" = release` into a silent
  # pass. Left in place, that same line fails and says why.
  binary-source:
    description: "how the litedoc4 executable was produced. Always `lake` — this action builds it from its own tree against the caller's toolchain"
    value: "${{ steps.keys.outputs.binary-source }}"

runs:
  using: composite
  steps:
    # Inputs reach the shell through `env`, never interpolated into the script
    # body: `${{ }}` is substituted before bash sees the line, so a value with a
    # quote in it would be running as code rather than being read as a string.
    - id: keys
      shell: bash
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        A="$GITHUB_ACTION_PATH"

        # Resolve --root once, here, so every later step and every cache key
        # talks about the same directory.
        case "$INPUT_ROOT" in
          /*) ROOT="$INPUT_ROOT" ;;
          *)  ROOT="$GITHUB_WORKSPACE/$INPUT_ROOT" ;;
        esac
        [ -d "$ROOT" ] || { echo "::error::no such package: $ROOT (input root=$INPUT_ROOT)"; exit 1; }
        ROOT="$(cd "$ROOT" && pwd)"

        OUT="$INPUT_OUT"
        if [ -z "$OUT" ]; then OUT="$RUNNER_TEMP/litedoc4-out"; fi
        case "$OUT" in /*) ;; *) OUT="$GITHUB_WORKSPACE/$OUT" ;; esac

        # **Restore caches only the first time this action runs in a job.**
        #
        # A second call re-runs every step, including `actions/cache`, and a
        # restore overwrites what the first call just produced: the state cache
        # hits on `restore-keys` and puts an OLDER commit's state back on top of
        # the fresh one. Measured — a second call rendered all 6 pages again
        # after restoring `litedoc4-state-…-9aa5519b` over its own output, while
        # the same two runs by hand rendered 0. The same shape would corrupt the
        # litedoc4 and extractor caches; they only escaped because their keys
        # happened to miss.
        SENTINEL="$RUNNER_TEMP/.litedoc4-action-has-run"
        if [ -f "$SENTINEL" ]; then FIRST=false; else FIRST=true; : > "$SENTINEL"; fi

        {
          echo "first=$FIRST"
          echo "root=$ROOT"
          echo "out=$OUT"
          # Hashed here rather than with hashFiles(): see the header. The
          # `litedoc4` key covers every file Lake compiles into the executable —
          # the Lean sources, the vendored C, and the lakefile that names the
          # MathML4Lean revision — plus the toolchain that compiles them.
          echo "extractor=$(cat "$A/extractor/Extract.lean" "$ROOT/lean-toolchain" 2>/dev/null | sha256sum | cut -c1-16)"
          echo "litedoc4=$( { cat "$A/lakefile.lean" "$ROOT/lean-toolchain" 2>/dev/null
                             find "$A/src" "$A/csrc" "$A/vendor" -type f | LC_ALL=C sort |
                               while read -r f; do cat "$f"; done
                           } | sha256sum | cut -c1-16)"
          echo "binary-source=lake"
          echo "manifest=$(sha256sum "$ROOT/lake-manifest.json" 2>/dev/null | cut -c1-16 || echo none)"
          echo "toolchain=$(tr -d '\n' < "$ROOT/lean-toolchain" 2>/dev/null || echo unknown)"
        } >> "$GITHUB_OUTPUT"

    - name: Cache the litedoc4 build
      if: inputs.cache == 'true' && steps.keys.outputs.first == 'true'
      uses: actions/cache@v6
      with:
        # Absolute, because the action's own tree is outside the workspace and a
        # relative path here would resolve against the workspace.
        #
        # One path, holding both the build output and the generated workspace
        # `tools/ci-build.sh` builds from (`.lake/host`, with MathML4Lean cloned
        # under it). Restoring one without the other makes Lake re-resolve and
        # rebuild, which is the cost this cache exists to avoid.
        path: ${{ github.action_path }}/.lake
        key: litedoc4-lean-${{ runner.os }}-${{ steps.keys.outputs.litedoc4 }}
        # A partial hit is worth taking: Lake reads its own traces and rebuilds
        # exactly what moved, so an older tree costs a recompile and never a
        # wrong binary — unlike a bare `-x` test on the file (ci-build.sh 4/5).
        restore-keys: litedoc4-lean-${{ runner.os }}-

    - name: Cache the Lean extractor
      if: inputs.cache == 'true' && steps.keys.outputs.first == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ github.action_path }}/extractor/build
        key: litedoc4-extractor-${{ runner.os }}-${{ steps.keys.outputs.extractor }}

    - name: Cache Mathlib's oleans
      if: inputs.cache == 'true' && inputs.cache-get == 'true' && steps.keys.outputs.first == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/mathlib
        key: litedoc4-mathlib-${{ steps.keys.outputs.manifest }}
        restore-keys: litedoc4-mathlib-

    # What makes a run incremental: last run's state. The key moves every commit
    # so each run saves its own, and restore-keys picks the most recent one up.
    - name: Cache the incremental state
      if: inputs.cache == 'true' && inputs.full != 'true' && steps.keys.outputs.first == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.keys.outputs.out }}
        key: litedoc4-state-${{ steps.keys.outputs.toolchain }}-${{ github.sha }}
        restore-keys: litedoc4-state-${{ steps.keys.outputs.toolchain }}-

    - name: Install elan
      if: inputs.install-elan == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v lake > /dev/null 2>&1; then
          echo "lake is already on PATH: $(command -v lake)"
          exit 0
        fi
        case "$RUNNER_OS" in
          Linux)  A=elan-x86_64-unknown-linux-gnu.tar.gz ;;
          macOS)  if [ "$(uname -m)" = arm64 ]; then A=elan-aarch64-apple-darwin.tar.gz; else A=elan-x86_64-apple-darwin.tar.gz; fi ;;
          *) echo "::error::unsupported runner OS for elan: $RUNNER_OS"; exit 1 ;;
        esac
        curl -sSfL "https://github.com/leanprover/elan/releases/latest/download/$A" | tar xz
        # `--default-toolchain none`: the package's lean-toolchain decides, and
        # elan fetches it on first use. Installing a default here would download
        # a second toolchain nobody asked for.
        ./elan-init -y --default-toolchain none
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        rm -f ./elan-init

    - id: build
      shell: bash
      env:
        ROOT: ${{ steps.keys.outputs.root }}
        OUT: ${{ steps.keys.outputs.out }}
        IN_CACHE_GET: ${{ inputs.cache-get }}
        IN_LAKE_BUILD: ${{ inputs.lake-build }}
        IN_JOBS: ${{ inputs.jobs }}
        IN_LIB: ${{ inputs.lib }}
        IN_SOURCE_URL: ${{ inputs.source-url }}
        IN_FULL: ${{ inputs.full }}
      run: |
        set -euo pipefail
        # `if`, not `[ … ] && …`: under `set -e` a false test is the last
        # command of the line and kills the step. That is not hypothetical —
        # it is how the first draft of this file failed for every caller who
        # left `cache-get` at its default.
        ARGS=()
        if [ "$IN_CACHE_GET" = "true" ]; then ARGS+=(--cache-get); fi
        if [ "$IN_LAKE_BUILD" != "true" ]; then ARGS+=(--no-lake-build); fi

        # Everything after `--` goes to `litedoc4 build` itself, so `--` has to
        # be one argument and the rest separate ones.
        PASS=()
        if [ -n "$IN_LIB" ]; then PASS+=(--lib "$IN_LIB"); fi
        if [ -n "$IN_SOURCE_URL" ]; then PASS+=(--source-url "$IN_SOURCE_URL"); fi
        if [ "$IN_FULL" = "true" ]; then PASS+=(--full); fi
        if [ "${#PASS[@]}" -gt 0 ]; then ARGS+=(-- "${PASS[@]}"); fi

        "$GITHUB_ACTION_PATH/tools/ci-build.sh" \
          --root "$ROOT" --out "$OUT" --jobs "$IN_JOBS" \
          ${ARGS[@]+"${ARGS[@]}"}

        {
          echo "site=$OUT/site"
          echo "out=$OUT"
          echo "timings=$OUT/ci-timings.json"
        } >> "$GITHUB_OUTPUT"
