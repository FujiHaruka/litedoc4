[package]
name = "litedoc4-md"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `$…$` to MathML at build time (`src/math.rs`, feature-sweep C-1). The root
# `Cargo.toml` says why it is this crate and not `pulldown-latex`.
math-core = { workspace = true }

[dev-dependencies]
# The escapes a failure message uses (`litedoc4_testutil::text`), shared so that
# a disagreement over one corpus prints the same way whichever oracle found it.
# Workspace-local and `publish = false`, so it is in neither NOTICE nor any
# released binary (docs/plans/refactoring.md §7 U3).
litedoc4-testutil = { path = "../litedoc4-testutil" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"

[lints]
workspace = true
