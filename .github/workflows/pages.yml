# The documentation site and the sample site, rebuilt from HEAD, as one Pages tree.
#
# `website/` is the documentation, at the root. The sample is under `sample/`.
# The other live site — the Mathlib-dependent package — is published by *that*
# repository when it releases, so it shows whichever litedoc4 it pinned. The
# sample shows what this commit produces, which is the question a reader looking
# at a change actually has.
#
# The sample is `e2e/micro`, the eleven-module sample package: scoped notation, an
# astral identifier, a formula the converter refuses, `class inductive`, the
# three shapes of `sorry`. **Its docstrings and `docs/index.md` are this site's
# copy** — strangers read them, so they are written for a stranger, and the
# reasons a declaration is there live in comments the site never shows.
#
# `tools/e2e-micro.sh` runs first and the deployment is downstream of it, so a
# site that failed its own gates is never the one being served.
#
# A Pages site has one `404.html`, at its root, and it is the documentation's.
# For a path under `sample/` it loads the sample's own `404.html`, which is what
# sends a versionless link to the newest version.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "csrc/**"
      - "vendor/**"
      - "lakefile.lean"
      - "extractor/**"
      - "e2e/micro/**"
      - "e2e/micro-dep/**"
      - "tools/build-lean-exe.sh"
      - "tools/e2e-micro.sh"
      - "website/**"
      - "docs/images/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued, not cancelled: a deployment killed halfway leaves Pages serving a tree
# nobody chose.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      # **The published sample is built by what a consumer actually gets**:
      # `lean_exe litedoc4`, compiled from this tree. A sample built any other
      # way would be a site nobody can reproduce from what they installed.
      - name: Cache the litedoc4 build
        uses: actions/cache@v6
        with:
          path: .lake
          key: litedoc4-lean-${{ runner.os }}-pages-${{ hashFiles('lakefile.lean', 'src/**', 'csrc/**', 'vendor/**', 'e2e/micro/lean-toolchain') }}
          restore-keys: litedoc4-lean-${{ runner.os }}-pages-

      - name: Build litedoc4
        run: tools/build-lean-exe.sh --toolchain-from e2e/micro

      - name: Build the site, through every gate
        env:
          LITEDOC4: ${{ github.workspace }}/.lake/build/bin/litedoc4
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      - uses: ./.github/actions/setup-node

      - name: Build the documentation
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Assemble the documentation and the sample into one tree
        run: |
          mkdir "$RUNNER_TEMP/pages"
          cp -R website/dist/. "$RUNNER_TEMP/pages/"
          cp -R "$RUNNER_TEMP/e2e/first/site" "$RUNNER_TEMP/pages/sample"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

      - id: deployment
        uses: actions/deploy-pages@v5
