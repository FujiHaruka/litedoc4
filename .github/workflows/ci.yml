# Everything here runs on a machine that has never seen the measurement target.
# Anything needing Mathlib stays a manual gate (tools/target2-gate.sh,
# tools/base-ir-gate.sh): a check that cannot run on a fresh runner is a gate,
# not a test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run holds slots against the 20-job concurrency limit while
# telling us nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: the tree checks itself (no target, no Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `fetch-tags` because `tools/version-gate.sh` reconciles the version
      # against the tags this repository has published, and a checkout without
      # them cannot answer either "is this version already out" or "which of
      # these strings is one of our tags". It refuses rather than passing, so
      # without this line the job is red and says nothing about the version.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-node

      # The only thing in the tree that compiles `web/src` at all: the executable
      # carries the bundle, never the sources.
      - name: Assets gate (the site's TypeScript)
        run: tools/assets-gate.sh --json "$RUNNER_TEMP/assets.json"

      # Reads files, nothing else: no binary, no toolchain, no target. The names
      # it checks are the ones a consumer's own workflow, `litedoc4.toml` or
      # script can contain, so a rename here is a broken file in someone else's
      # repository.
      - name: The 1.x surface is all still there
        run: tools/public-surface-gate.sh

      # Four claims about the workflows themselves: the gate inventory covers
      # every gate, the ci/manual labels are true, nothing that needs node runs
      # without installing it, and no gate prints a heading the shell would eat.
      - name: The workflows do what the tree says they do
        run: tools/workflow-gate.sh

      # Two obligations CLAUDE.md states: a `(measured)` number's log has to be
      # followable, and a pointer at a deleted document has to say it is deleted.
      - name: Citations resolve
        run: tools/docs-gate.sh

      # The site's static files live in `assets/` and the generated
      # `src/Litedoc4/Assets.lean` carries them as Lean string literals. Two
      # copies of a stylesheet is the shape where only one of them is ever
      # fixed. The vite half of the chain is the assets gate's, above, because
      # it is the only job that has already run vite.
      - name: One answer to what the assets are
        run: tools/assets-embed-gate.sh

      # The two corpora minted outside this tree are carried into a generated
      # Lean module, and the invariants that read them run in the aarch64 job
      # below. This is the half that needs no toolchain: the module is what the
      # fixtures generate, and the case counts the invariants assert are the
      # counts the fixtures hold.
      - name: The Markdown oracles are still what the invariants read
        run: tools/md-oracle-gate.sh

      # A release moves one literal in Version.lean; six other files repeat it,
      # and until this gate nothing read either side. Item 3 is the one that
      # cannot be answered by reading the tree alone: it asks the tags whether
      # this version has already been published somewhere else.
      - name: Every place that names the version names the same one
        run: tools/version-gate.sh

      # This repository is public, so Apache-2.0 §4 is live: what this stops is
      # a refactor deleting an attribution that is legally load-bearing.
      - name: Provenance
        run: tools/provenance-gate.sh

  # aarch64, because that is where `char` is unsigned and every other machine
  # this tree is compiled on has it signed. The C is `vendor/md4c/md4c.c` and
  # `csrc/md_events.c`, which Lake compiles into the executable, so the question
  # is live: when this job was first added it found two defects on its first run
  # (measured 2026-08-29 -> benchmarks/results/arm64-linux-runner-2026-08-29.txt).
  #
  # **The invariants only.** The gates, the licences and the TypeScript are
  # architecture-blind, and running them twice would buy a slower CI and the
  # same answer.
  test-arm64:
    name: aarch64 (the Lean invariants)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      - name: The Lean half's invariants
        run: tools/lean-test-gate.sh

  # `deno run` strips types rather than checking them, so nothing else in CI
  # looks at the measurement tooling's TypeScript at all.
  benchmarks-ts:
    name: measurement tooling (types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check benchmarks/tools
        run: tools/benchmarks-ts-gate.sh

  # The one enumerated Unicode table in src/ that still has a live oracle: V8's
  # own `\p{Z}\p{C}`, which deno answers with nothing else installed.
  v8-gc-table:
    name: "the V8 Z|C table (re-derived)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Exact, where the job above floats on v2.x. The table *is* this runtime's
      # answer and the generated header records which runtime gave it, so a
      # floating deno turns the gate into an alarm about deno's release
      # cadence instead of about the table. Bump this line in the same commit
      # that regenerates the table with a newer deno.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14

      - name: Re-derive src/Litedoc4/Global/V8GcTable.lean
        run: tools/v8-gc-table-gate.sh

  # The only job here that runs a real Lean environment. The job above reads the
  # tree and never runs the extractor, so nothing there checks the contract
  # between `extractor/Extract.lean` and what consumes its IR.
  e2e-micro:
    name: e2e (real extractor, no Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Lean core only. The sample depends on nothing else, which is what keeps
      # this job to minutes instead of the gigabytes Mathlib would cost.
      - uses: ./.github/actions/setup-elan

      - name: Build the CLI
        run: tools/build-lean-exe.sh --toolchain-from e2e/micro

      - name: End to end
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      # The gate's own header asks for the measurement target, that target's
      # toolchain and the 171 MB Mathlib extractor — but every one of those is
      # an argument: `--target`, `--lib`, `--module` and `EXTRACT_BIN` all name
      # what the step above just built, so it runs in seconds with no Mathlib
      # (measured 2026-08-24 → benchmarks/results/watch-gate-e2e-2026-08-24.txt).
      # It writes nothing under `--target`: "module M changed" is injected into
      # this run's own copy of the ledger with `litedoc4 ledger touch`.
      #
      # Falsified both ways before being turned on (measured 2026-08-24):
      # `--inject wrong-module` comes out red on the render set alone (the three
      # counts stay 1/1/1, which is why the name check is there), and
      # `--inject no-touch` times out rather than reporting a run it never saw.
      - name: Watch gate (the loop, on the sample package)
        run: |
          tools/watch-gate.sh --out "$RUNNER_TEMP/watch" \
            --target "$GITHUB_WORKSPACE/e2e/micro" --lib Example \
            --module Example.Unicode --other Example.Notation
        env:
          LITEDOC4: ${{ github.workspace }}/.lake/build/bin/litedoc4
          EXTRACT_BIN: ${{ github.workspace }}/e2e/micro/.lake/e2e-extract/extract

      # The other half of the same input: `e2e/micro-dep` required by *git*
      # with a real 40-hex rev instead of by path. Only the wiring differs, so
      # pinnability is the only variable — and it is the variable that decides
      # whether a dependency's modules get blob URLs at all. The gate builds the
      # git repository itself and rewrites the remote with git's `insteadOf`, so
      # it stays offline while the manifest still carries an https URL.
      - name: Pinnable dependency with guillemet modules
        run: tools/pinned-dep-gate.sh --out "$RUNNER_TEMP/pinned"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Static checks cannot see whether the module tree draws, whether search
      # returns anything, or whether 375 px still fits. ubuntu-latest ships
      # Chrome, so nothing is downloaded to drive it.
      - name: Browser gate
        run: tools/browser-gate.sh "$RUNNER_TEMP/e2e/first/site" --json "$RUNNER_TEMP/browser.json"
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload the generated site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-micro-site
          path: ${{ runner.temp }}/e2e/first/site
          if-no-files-found: warn
