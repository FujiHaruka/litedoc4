# The site ships no monospace web font (e.g. JuliaMono); it bets that the system
# monospace stack renders what a Lean package's pages contain. macOS and
# `ubuntu-latest` show no missing glyph (measured). Windows is measurable here and
# not on this desk: `windows-latest` ships Consolas *and* Chrome.
#
# Two jobs, because the site has to be built where Lean runs: ubuntu builds the
# sample S's two renders (path and hash URLs) and uploads them, Windows downloads
# them and drives Chrome through tools/mv-pages-gate.sh. The font check
# (`mono-glyphs`) does not read its character set out of the site — it reads
# `benchmarks/tools/mono-charset.json`, the 178 non-ASCII characters of the
# measurement target — so the tiny sample is enough to judge a font stack.
#
# `workflow_dispatch` only: verification workflows stay off `push`.
name: browser gate on Windows (U3)

on:
  workflow_dispatch:

concurrency:
  # `cancel-in-progress: false`: a double dispatch queues instead of killing the
  # run already measuring.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The incremental state is written and cached but never read back on a
  # throwaway runner.
  CARGO_INCREMENTAL: 0

jobs:
  site:
    name: build the sample's renders (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      - name: Build the CLI
        run: tools/build-lean-exe.sh --toolchain-from e2e/micro

      - name: The S loop, keeping its two renders
        run: tools/mv-s-gate.sh --out "$RUNNER_TEMP/mv-s" --keep

      # The same gate this job could run itself, run here so that a Windows
      # failure downstream is known to be about Windows and not about the site.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Page gate (ubuntu, for comparison)
        run: tools/mv-pages-gate.sh --from "$RUNNER_TEMP/mv-s" | tee "$RUNNER_TEMP/pages-ubuntu.txt"
        shell: bash -o pipefail {0}
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload the renders for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: s-renders
          path: |
            ${{ runner.temp }}/mv-s/run1/render/all-1
            ${{ runner.temp }}/mv-s/run1/render/hash-1
          if-no-files-found: error

      - name: Upload the ubuntu report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-ubuntu
          path: ${{ runner.temp }}/pages-ubuntu.txt
          if-no-files-found: warn

  windows:
    name: browser gate (windows-latest)
    needs: site
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: s-renders
          path: renders

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Printed before the gate runs, because "the gate was green" and "the gate
      # ran against Consolas" are different claims and only this step can tell
      # them apart. If Chrome is not at this path the gate says so and exits 2
      # rather than passing.
      - name: Is Chrome where the gate will look
        shell: bash
        run: ls -la "/c/Program Files/Google/Chrome/Application/chrome.exe"

      # `System.Drawing` is not loaded in the runner's PowerShell by default:
      # without `Add-Type` this dies with "Cannot find type
      # [System.Drawing.Text.InstalledFontCollection]".
      - name: What monospace fonts are here
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          (New-Object System.Drawing.Text.InstalledFontCollection).Families |
            Where-Object { $_.Name -match 'Consolas|Cascadia|Courier|Mono' } |
            ForEach-Object { $_.Name }

      - name: Page gate
        shell: bash -o pipefail {0}
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: tools/mv-pages-gate.sh --site renders/all-1 --hash renders/hash-1 | tee pages-windows.txt

      - name: Upload the Windows report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-windows
          path: pages-windows.txt
          if-no-files-found: warn
