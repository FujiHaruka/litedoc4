[package]
name = "litedoc4-render"
license.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
litedoc4-ir = { path = "../litedoc4-ir" }
# For `Html.escape`, which the docstring renderer needs too. The dependency
# points this way on purpose (plan §7): pages are built on top of docstrings.
litedoc4-md = { path = "../litedoc4-md" }
# One digest of about a kilobyte: `ExternalLinks::digest`, the identity the
# incremental render key records for the dependency link map (M7-b). The `asm`
# feature is litedoc4-incr's and matters there, not at this size; it is named
# here too only so a build of this crate alone picks the same implementation.
# **`asm` is not available under MSVC.** `sha2-asm` ships GAS-syntax `.S`, and
# cc-rs hands it to `cl.exe`, which produces no object for `lib.exe` to archive
# (`LNK1181: cannot open input file … sha512_x64.o`, measured 2026-08-30). The
# straightforward `features = ["asm"]` everywhere is what stops a Windows build
# from existing at all. This splits by `target_env` rather than dropping the
# feature: on aarch64 it is what reaches the ARMv8 SHA-256 instructions, worth
# 2.86x on the olean hash. If sha2-asm ever grows an MSVC path, the two lines
# collapse back into one.
sha2 = { version = "0.10" }
# `litedoc4.toml` (`src/config.rs`, feature-sweep C-3). The root `Cargo.toml`
# says why it is this crate and not `toml`.
basic-toml = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
# Temporary directories, shared so that the workspace has one implementation
# of "remove this tree when the test ends" instead of fifteen. Workspace-local
# and `publish = false`, so it is in neither NOTICE nor any released binary.
litedoc4-testutil = { path = "../litedoc4-testutil" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
