# Everything here runs on a machine that has never seen the measurement target.
# Anything needing Mathlib stays a manual gate (tools/target2-gate.sh,
# tools/corpus-gate.sh): a check that cannot run on a fresh runner is a gate,
# not a test.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run holds slots against the 20-job concurrency limit while
# telling us nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once from a restored cache and throws the machine away, so the
  # incremental state is only ever written, cached and restored, never read
  # back. Locally it was 3.5 GB of a 7.2 GB `target/`, and the cargo cache is
  # what pushed this repository to 98.8% of the 10 GiB limit.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (no corpus, no Lean)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      # Before the Rust half: thirty seconds against cargo's ten minutes, and
      # `cargo build` cannot even start if the TypeScript does not bundle.
      - name: Assets gate (the site's TypeScript)
        run: tools/assets-gate.sh --json "$RUNNER_TEMP/assets.json"

      # `rustup show` is what makes rustup act on rust-toolchain.toml.
      - name: Install the toolchain rust-toolchain.toml asks for
        run: |
          rustup show
          rustc --version
          cargo --version

      # No `restore-keys`, and the key names the job. A `cargo-<os>-` fallback
      # makes the entry a ratchet: a new Cargo.lock restores the previous
      # generation's `target/`, builds on top of it and saves the union, so the
      # entry grows every time the lockfile moves — 72 MB → 2177 MB over three
      # days, 8.47 GiB of the repository's 10 GiB cache limit, 63 s to restore
      # in a job whose build was 14 s. Cutting the fallback means a lockfile
      # change builds cold, which is cheap at 34 packages. A key not naming the
      # job is shared with `e2e-micro` (one binary) and ci-template.yml (whose
      # `target/` is at another path), so whichever job saved last decided what
      # the others got back. `rust-toolchain.toml` joins the hash because a
      # channel bump invalidates every artifact in `target/` anyway.
      #
      # What the cache buys is not measurable: warm and cold, n=4 each on
      # identical sources, put this job at the same 61.0 s mean. It stays
      # because it is cheap and correct, not because it was shown to pay
      # (measured → benchmarks/results/ci-cache-2026-08-19.txt).
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-ci-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      # Which lints are on is `[workspace.lints]` in the root Cargo.toml, not
      # this line, so a local `cargo check` says the same thing this job says;
      # all that happens here is the promotion to an error. Do not add `-W` here
      # — it would be a gate invisible from the working tree.
      #
      # `--all-targets` so that tests and benches are linted too: most of this
      # workspace's code by line count is tests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # An unresolved `[`Foo`]` is a doc comment still naming code that moved.
      # Comments are rare here and carry why-not, so a broken link is a stale
      # pointer, not a formatting slip — this is the one kind of comment rot a
      # machine can catch.
      #
      # `--document-private-items` because nothing outside this repository
      # consumes these crates, so most of what a link can name is private;
      # `private_intra_doc_links` is allowed for the same reason.
      - name: Rustdoc links
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links

      # A dependency nobody imports is still a crate to compile and still an
      # entry in what `cargo deny` has to vouch for.
      - uses: taiki-e/install-action@cargo-machete
      - name: Unused dependencies
        run: cargo machete

      # `--no-fail-fast`: one red crate must not hide the state of the others.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The corpus tests are `#[ignore]`d rather than run here; this asserts the
      # set of them is exactly the set the gate knows about, so neither side can
      # drift and a test cannot quietly stop running.
      - name: Verify the corpus gate's inventory
        run: tools/corpus-gate.sh --verify-list

      # This repository is public, so Apache-2.0 §4 is live: what this stops is
      # a refactor deleting an attribution that is legally load-bearing.
      - name: Provenance
        run: tools/provenance-gate.sh

  # The tree we pull in, as opposed to the attributions we wrote (which the test
  # job checks). Policy is deny.toml.
  supply-chain:
    name: supply chain (licences, advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # `deno run` strips types rather than checking them, so nothing else in CI
  # looks at the measurement tooling's TypeScript at all.
  benchmarks-ts:
    name: measurement tooling (types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check benchmarks/tools
        run: tools/benchmarks-ts-gate.sh

  # The only job that runs a real Lean environment. Every test in the job above
  # fakes the extractor, so nothing there checks the contract between
  # `extractor/Extract.lean` and the Rust side: change what the extractor writes
  # and the whole test job stays green.
  e2e-micro:
    name: e2e (real extractor, no Mathlib)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - name: Install the toolchain rust-toolchain.toml asks for
        run: rustup show

      # Keyed per job and without `restore-keys` — see the note in `test`. This
      # job builds one binary; `test` builds --all-targets, so a shared key
      # would have them overwriting each other's entry.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-ci-e2e-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      # Lean core only. The fixture depends on nothing else, which is what keeps
      # this job to minutes instead of the gigabytes Mathlib would cost.
      - uses: ./.github/actions/setup-elan

      - name: Build the CLI
        run: cargo build --bin litedoc4

      - name: End to end
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      # The gate's own header asks for the measurement target, that target's
      # toolchain and the 171 MB Mathlib extractor — but every one of those is
      # an argument: `--target`, `--lib`, `--module` and `EXTRACT_BIN` all name
      # what the step above just built, so it runs in seconds with no Mathlib
      # (measured 2026-08-24 → benchmarks/results/watch-gate-e2e-2026-08-24.txt).
      # It writes nothing under `--target`: "module M changed" is injected into
      # this run's own copy of the ledger with `litedoc4 ledger touch`.
      #
      # Falsified both ways before being turned on (measured 2026-08-24):
      # `--inject wrong-module` comes out red on the render set alone (the three
      # counts stay 1/1/1, which is why the name check is there), and
      # `--inject no-touch` times out rather than reporting a run it never saw.
      - name: Watch gate (the loop, on the e2e fixture)
        run: |
          tools/watch-gate.sh --out "$RUNNER_TEMP/watch" \
            --target "$GITHUB_WORKSPACE/e2e/micro" --lib Micro \
            --module Micro.Unicode --other Micro.Notation
        env:
          LITEDOC4: ${{ github.workspace }}/target/debug/litedoc4
          EXTRACT_BIN: ${{ github.workspace }}/e2e/micro/.lake/e2e-extract/extract

      # The other half of the same fixture: `e2e/micro-dep` required by *git*
      # with a real 40-hex rev instead of by path. Only the wiring differs, so
      # pinnability is the only variable — and it is the variable that decides
      # whether a dependency's modules get blob URLs at all. The gate builds the
      # git repository itself and rewrites the remote with git's `insteadOf`, so
      # it stays offline while the manifest still carries an https URL.
      - name: Pinnable dependency with guillemet modules
        run: tools/pinned-dep-gate.sh --out "$RUNNER_TEMP/pinned"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Static checks cannot see whether the module tree draws, whether search
      # returns anything, or whether 375 px still fits. ubuntu-latest ships
      # Chrome, so nothing is downloaded to drive it.
      - name: Browser gate
        run: tools/browser-gate.sh "$RUNNER_TEMP/e2e/first/site" --json "$RUNNER_TEMP/browser.json"
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload the generated site
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-micro-site
          path: ${{ runner.temp }}/e2e/first/site
          if-no-files-found: warn
