# A measurement, not a gate: its numbers go to benchmarks/results/.
name: multi-version L render memory

on:
  push:
    branches: [multi-version]
    paths:
      - ".github/workflows/mv-l-render.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MV_L_WORK: /home/runner/mv-l
    steps:
      - uses: actions/checkout@v7

      - name: GNU time
        run: sudo apt-get install -y time

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: record the machine
        run: |
          mkdir -p "$MV_L_WORK/logs"
          benchmarks/tools/record-runner.sh "$MV_L_WORK/logs/runner-start.txt"

      - name: litedoc4
        run: |
          tools/build-lean-exe.sh --toolchain-from e2e/micro >"$MV_L_WORK/logs/litedoc4-build.log" 2>&1
          sha256sum .lake/build/bin/litedoc4 | tee "$MV_L_WORK/logs/litedoc4.sha256"

      - name: the store of run 37630692670
        uses: actions/download-artifact@v8
        with:
          name: mv-l-store
          path: /home/runner/mv-l/out/store
          run-id: 37630692670
          github-token: ${{ github.token }}

      - name: (g) experiment -- the RSS floor after each version, by how far each version is taken
        env:
          MIMALLOC_PURGE_DELAY: "0"
        run: |
          for phase in full render data input read; do
            rm -rf "$MV_L_WORK/render-exp"
            LITEDOC4_EXP_PHASE="$phase" /usr/bin/time -v .lake/build/bin/litedoc4 store render --store "$MV_L_WORK/out/store" \
              --versions v4.32.2,v4.33.0,v4.33.1 --out "$MV_L_WORK/render-exp" \
              >"$MV_L_WORK/logs/exp-$phase.out" 2>"$MV_L_WORK/logs/exp-$phase.err" || true
            grep -E '^exp floor|Maximum resident|Elapsed' "$MV_L_WORK/logs/exp-$phase.err"
          done

      - name: upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mv-l-render
          path: /home/runner/mv-l/logs
