# ci.yml answers "is the code green"; this answers "is the distribution channel
# green". The lakefile can be broken while every test passes — a script Lake
# never registers, a `--lib` lookup that reads the wrong field, an extractor
# target that does not build — and no Rust is involved in any of it, so neither
# `cargo test` nor `cargo clippy` sees it.
#
# The consumers are generated here rather than committed: `e2e/consumer/`
# requires by path and is the local fixture, and a second committed copy that
# differs only in its require line would drift from it silently.
name: lake package (self-test)

on:
  push:
    branches: [main]
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "extractor/**"
      - "src/**"
      - "csrc/**"
      - "vendor/**"
      - "e2e/consumer/**"
      - "e2e/micro/**"
      - "Cargo.toml"
      - "tools/lake-package-gate.sh"
      - "tools/purelean-gate.sh"
      - "tools/purelean-micro-gate.sh"
      - "tools/render-compare.sh"
      - "tools/usedby-gate.sh"
      - "benchmarks/tools/check-site-closure.py"
      - "tools/lib/common.sh"
      - "tools/libc-shim-gate.sh"
      - ".github/workflows/ci-lake.yml"
  pull_request:
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "extractor/**"
      - "src/**"
      - "csrc/**"
      - "vendor/**"
      - "e2e/consumer/**"
      - "e2e/micro/**"
      - "Cargo.toml"
      - "tools/lake-package-gate.sh"
      - "tools/purelean-gate.sh"
      - "tools/purelean-micro-gate.sh"
      - "tools/render-compare.sh"
      - "tools/usedby-gate.sh"
      - "benchmarks/tools/check-site-closure.py"
      - "tools/lib/common.sh"
      - "tools/libc-shim-gate.sh"
      - ".github/workflows/ci-lake.yml"
  workflow_dispatch:

concurrency:
  # A superseded run holds slots against the 20-job concurrency limit while
  # telling us nothing about HEAD.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The incremental state is written and cached but never read back on a
  # throwaway runner.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # The same items the gate runs locally, on the OS the probe never measured:
  # every number in benchmarks/results/lake-package-probe-2026-08-18.txt is
  # macOS/arm64 and `leanc`'s defaults differ per platform. This requires by
  # path, which is not the channel a user goes through — that is `git-require`.
  gate:
    name: the five gate items, on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-elan

      - uses: Swatinem/rust-cache@v2

      - name: Build litedoc4
        run: cargo build --bin litedoc4

      - name: Gate
        run: tools/lake-package-gate.sh

  # The Lean half: `lean_exe litedoc4`, built the way a consumer builds it.
  # Nothing in ci.yml reaches it — it is Lean and C, and neither `cargo test` nor
  # `cargo clippy` has a view of either — and `lake` cannot run beside the root
  # lakefile (there is deliberately no `lean-toolchain` there), so this job and
  # the development machine are the only two places it is ever compiled.
  purelean:
    name: the Lean half builds and runs from a consumer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-elan

      - uses: Swatinem/rust-cache@v2

      # The one check that wants the machine's compiler rather than the
      # toolchain's, and the reason it is worth running here as well: a
      # `csrc/libc` declaration that disagrees with glibc's is undefined
      # behaviour no build error announces, and the macOS headers are only one
      # platform's opinion.
      - name: csrc/libc agrees with the platform's libc
        run: tools/libc-shim-gate.sh

      # `purelean-gate.sh` compares the two halves' `--version`, so it needs one.
      - name: Build litedoc4
        run: cargo build --bin litedoc4

      - name: Gate
        run: tools/purelean-gate.sh

  # The same question `purelean-render-gate.sh` asks over the measurement target,
  # asked over the sample instead — which is what makes it runnable here at all,
  # and is *not* a weaker version of it: e2e/micro holds the declaration shapes
  # the target does not have, and one of them (a class extending one whose
  # defining module the sample does not declare) is the only input either
  # renderer has ever had to refuse.
  #
  # It covers `site` as well as `render`, so the nine whole-package artifacts are
  # in it — and the last three items also ask whether the Lean site closes over
  # itself, which two byte-identical trees can both fail to do.
  purelean-micro:
    name: the two implementations agree on the sample package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-elan

      - uses: Swatinem/rust-cache@v2

      # The oracle, and what extracts the sample's IR.
      - name: Build litedoc4
        run: cargo build --bin litedoc4

      - name: Gate
        run: tools/purelean-micro-gate.sh

  # The channel a user actually goes through: a generated consumer says
  # `require «litedoc4» from git … @ "<this commit>"`, so Lake clones this
  # repository over the network into `.lake/packages/litedoc4`. The require line
  # is generated, so it can pin this commit and grade this diff.
  git-require:
    name: a consumer requires this commit over the network
    # A fork PR's head commit is not in this repository, so `@ <sha>` could not
    # be resolved; cloning `main` instead would report on code nobody proposed.
    # A same-repo PR pins its head commit, which is what lets a new lakefile be
    # exercised before it reaches main.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The commit the generated consumer pins. For a pull_request the head
      # commit, not `github.sha` (which is the *merge* commit: it exists only
      # under refs/pull/N/merge, and Lake's clone would not have it).
      REQUIRE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      # Written outside the checkout so that nothing here can accidentally
      # resolve to the working tree instead of the clone Lake makes.
      - name: Generate a consumer that requires this commit
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/consumer"
          mkdir -p "$CONSUMER/Widget"
          cp e2e/micro/lean-toolchain "$CONSUMER/lean-toolchain"
          cat > "$CONSUMER/lakefile.lean" <<LAKEFILE
          import Lake
          open Lake DSL

          require «litedoc4» from git
            "https://github.com/FujiHaruka/litedoc4" @ "$REQUIRE_SHA"

          package widget

          lean_lib Widget
          LAKEFILE
          cat > "$CONSUMER/Widget.lean" <<'LEAN'
          import Widget.Basic
          LEAN
          cat > "$CONSUMER/Widget/Basic.lean" <<'LEAN'
          /-- The answer. -/
          def widgetAnswer : Nat := 42

          /-- It is the answer. -/
          theorem widgetAnswer_eq : widgetAnswer = 42 := rfl
          LEAN
          # A real consumer is a git checkout with a GitHub `origin`, and
          # `litedoc4 build` derives --source-url from exactly that. The first
          # version of this step skipped it and the job failed with
          # `git rev-parse HEAD … not a git repository` (measured 2026-08-18) — the
          # fixture, not the product, was the thing that did not look like a
          # user's package. `.lake/` is excluded because `lake update` clones
          # litedoc4 into it and a repository inside a repository is not what is
          # being tested here.
          printf '.lake/\n' > "$CONSUMER/.gitignore"
          git -C "$CONSUMER" init -q
          git -C "$CONSUMER" add .
          git -C "$CONSUMER" -c user.name=ci -c user.email=ci@example.invalid \
            commit -qm "the fixture"
          git -C "$CONSUMER" remote add origin \
            https://github.com/FujiHaruka/litedoc4-consumer-fixture.git
          echo "CONSUMER=$CONSUMER" >> "$GITHUB_ENV"

      - name: lake update, then build the consumer
        working-directory: ${{ env.CONSUMER }}
        run: |
          set -euo pipefail
          lake update
          test -d .lake/packages/litedoc4 \
            || { echo "::error::lake did not check litedoc4 out into .lake/packages"; exit 1; }
          # The clone has to be *this* commit, not whatever main happens to be.
          GOT="$(git -C .lake/packages/litedoc4 rev-parse HEAD)"
          [ "$GOT" = "$REQUIRE_SHA" ] \
            || { echo "::error::cloned $GOT, wanted $REQUIRE_SHA"; exit 1; }
          lake build

      - name: lake run docs
        working-directory: ${{ env.CONSUMER }}
        run: |
          set -euo pipefail
          lake run docs -- --out "$RUNNER_TEMP/widget-docs" | tee "$RUNNER_TEMP/docs.log"
          # `lake run` reports the script's exit code, but a script that exits 0
          # without writing anything is the failure this repository keeps
          # catching. Ask the filesystem.
          test -f "$RUNNER_TEMP/widget-docs/site/index.html" \
            || { echo "::error::no site was written"; exit 1; }
          # And that --lib really came from Lake: nothing above passed one.
          test -f "$RUNNER_TEMP/widget-docs/site/Widget/Basic.html" \
            || { echo "::error::Widget.Basic has no page — the --lib lookup missed it"; exit 1; }
          grep -q -- "--lib Widget" "$RUNNER_TEMP/docs.log" \
            || { echo "::error::the script did not derive --lib Widget"; exit 1; }

      - name: The site closes over itself
        run: tools/site-gate.sh "$RUNNER_TEMP/widget-docs/site"

  refused:
    name: a consumer with no lean_lib fails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-elan

      - name: A package with no lean_lib is refused, by name
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/empty"
          mkdir -p "$CONSUMER"
          cp e2e/micro/lean-toolchain "$CONSUMER/lean-toolchain"
          cat > "$CONSUMER/lakefile.lean" <<LAKEFILE
          import Lake
          open Lake DSL

          require «litedoc4» from "${{ github.workspace }}"

          package empty
          LAKEFILE
          cd "$CONSUMER"
          lake update
          set +e
          lake run docs -- --out "$RUNNER_TEMP/empty-docs" >out.log 2>&1
          CODE=$?
          set -e
          cat out.log
          # Not just "non-zero": the exit code names *which* refusal, and the
          # message has to say what was missing. A package that failed to build
          # would also be non-zero and would prove nothing.
          [ "$CODE" -eq 3 ] \
            || { echo "::error::expected exit 3 (no lean_lib), got $CODE"; exit 1; }
          grep -q "declares no .lean_lib" out.log \
            || { echo "::error::exit 3 but the message does not name the reason"; exit 1; }
          test ! -e "$RUNNER_TEMP/empty-docs" \
            || { echo "::error::it refused and still created --out"; exit 1; }
