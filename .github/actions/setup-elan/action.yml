name: Set up elan
description: >
  Install elan at the toolchain `e2e/micro/lean-toolchain` pins, from a cache
  when there is one, and put it on PATH.

# WHY THE TOOLCHAIN FILE IS NOT AN INPUT
#   All twelve call sites pin the same file. An earlier design expected two
#   (`e2e/micro/lean-toolchain` and `target/lean-toolchain`); the
#   tree has one (measured 2026-08-23). An input with one caller is a parameter
#   nobody has chosen yet — add it when a second toolchain arrives, and let the
#   cache key change with it then.
#
# WHY THE ARCHITECTURE IS READ AND NOT WRITTEN
#   Every caller is Linux, and until 2026-08-29 every one of them was x86_64, so
#   the tarball name was a literal. `release.yml`'s smoke job now runs on
#   `ubuntu-24.04-arm`, and a literal would have installed an x86_64 elan on it.
#   `uname -m` spells the architecture the way elan's assets do, on both
#   (`x86_64` / `aarch64`), so nothing translates it.
#
# WHY THE CACHE KEY CARRIES THE ARCHITECTURE
#   `runner.os` is `Linux` on both, and a key that cannot tell them apart hands
#   the arm job the x86_64 elan it just went to the trouble of not downloading —
#   a cache hit that installs the wrong binary, which fails at the first `lake`
#   and blames Lean.
runs:
  using: composite
  steps:
    - name: Cache elan
      id: elan-cache
      uses: actions/cache@v6
      with:
        path: ~/.elan
        key: elan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/micro/lean-toolchain') }}

    - name: Install elan at the sample's toolchain
      if: steps.elan-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        curl -sSfL "https://github.com/leanprover/elan/releases/latest/download/elan-$(uname -m)-unknown-linux-gnu.tar.gz" \
          | tar xz
        ./elan-init -y --default-toolchain "$(cat e2e/micro/lean-toolchain)"

    - name: Put elan on PATH
      shell: bash
      run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
