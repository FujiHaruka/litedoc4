# ci-import-prefetch.yml left one thing open: prefetch cut `importModules` by 76%
# on Linux but the wall clock by only 4%, because the import closure is 4.14 GB
# while the import needs ~2.5 GB and the runner disk does ~210 MB/s. Would
# reading LESS help?
#
# The oracle set is exactly what a cold import was *observed* to touch. It is not
# computable ahead of time in production, so it is not a proposal — it is the
# upper bound on what any narrowing could achieve. If it does not move the wall
# clock either, narrowing is dead and the answer is to place doc generation in
# the build job. Deriving it: drop the cache, run the extractor, then ask mincore
# which olean pages are resident, with nothing else in between.
#
# Every variant runs in one job because two earlier runs disagreed by 3.3x on the
# SAME cold measurement (20.4 s vs 63-71 s, different runner instances, different
# readahead), which makes cross-run comparison invalid.
#
# The extractor was swapped and this workflow has not run since — the swap is
# UNVERIFIED. The steps below now build and run `extractor/` (IR schema 4); the
# 76% / 4% / 4.14 GB / ~2.5 GB above came from the frozen prototype extractor
# (IR schema 3, tag `experiments-frozen`). The CLI shape is identical —
# `extract <modules.txt> <out.jsonl> [flags]` — but schema 4 does more analysis
# after the import, and the oracle set derived here is the set schema 4 touches,
# which need not equal the one schema 3 touched. Do not put a number from one
# side of the swap next to one from the other.
name: CI importModules prefetch — narrow set (measurement)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "commit of FujiHaruka/information-theory"
        required: false
        default: "ca4fd931952b5e93045d210007bdd7e14c118d34"
      reps:
        description: "repetitions per variant"
        required: false
        default: "2"

concurrency:
  # `cancel-in-progress: false`: a double dispatch queues instead of killing the
  # run already measuring.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrow:
    runs-on: ubuntu-latest
    # GitHub terminates any job at 6 h, so a timeout close to that cannot tell
    # "this hung" from "GitHub gave up". 38 min at the default inputs; `reps`
    # scales it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: { path: litedoc4 }
      - uses: actions/checkout@v7
        with:
          repository: FujiHaruka/information-theory
          ref: ${{ github.event.inputs.target_ref }}
          path: target

      - name: Record the machine
        run: |
          {
            date -u +%Y-%m-%dT%H:%M:%SZ; uname -srm; nproc; getconf PAGESIZE
            echo "runner ${RUNNER_OS}/${RUNNER_ARCH} image ${ImageOS:-?} ${ImageVersion:-?}"
            echo "target_ref $(git -C target rev-parse HEAD)"
            grep -E '^(MemTotal|SwapTotal)' /proc/meminfo
            cat target/lean-toolchain
          } | tee env-before.txt

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain "$(cat target/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the probes
        run: |
          cc -O2 -o olean-residency litedoc4/benchmarks/tools/olean-residency.c
          cc -O2 -pthread -o olean-prefetch litedoc4/benchmarks/tools/olean-prefetch.c

      - name: lake exe cache get
        working-directory: target
        run: lake exe cache get 2>&1 | tail -3

      - name: Build the extractor
        env:
          TARGET_REPO: ${{ github.workspace }}/target
        run: litedoc4/extractor/build.sh 2>&1 | tail -3

      - name: lake build
        working-directory: target
        run: /usr/bin/time -v lake build 2>&1 | tail -8

      - name: Build the closure set (the set the earlier run used)
        env:
          TARGET_REPO: ${{ github.workspace }}/target
          LEAN_TOOLCHAIN_DIR: /home/runner/.elan/toolchains/leanprover--lean4---v4.31.0
        run: |
          find target -name '*.olean*' | sort > set-blind.txt
          python3 litedoc4/benchmarks/tools/import-closure.py \
            litedoc4/benchmarks/results/it-modules.txt --olean-out set-closure.txt
          echo "closure $(wc -l < set-closure.txt) / blind $(wc -l < set-blind.txt)"

      - name: Derive the ORACLE set — what a cold import actually touches
        env:
          MODULES: ${{ github.workspace }}/litedoc4/benchmarks/results/it-modules.txt
        run: |
          W="$GITHUB_WORKSPACE"
          sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
          ( cd target && lake env "$W/litedoc4/extractor/build/extract" \
              "$MODULES" "$W/ex-derive.jsonl" ) > ex-derive.log 2>&1
          ./olean-residency < set-blind.txt > residency-oracle.jsonl
          # Any olean with at least one resident page was touched by the import.
          # Fields are {"path":...,"bytes":...,"pages":...,"resident_pages":...,...}.
          python3 - <<'PY'
          import json
          keep=[]; kb=0
          for line in open('residency-oracle.jsonl'):
              line=line.strip()
              if not line: continue
              r=json.loads(line)
              if r.get('resident_pages', 0) > 0:
                  keep.append(r['path']); kb += r.get('resident_bytes', 0)
          assert keep, 'oracle set is empty — residency probe returned nothing resident'
          open('set-oracle.txt','w').write('\n'.join(keep)+'\n')
          print('oracle files:', len(keep), 'resident bytes:', kb)
          PY
          echo "oracle $(wc -l < set-oracle.txt) files"
          head -2 residency-oracle.jsonl

      - name: Measure — baseline / closure / oracle, all on this runner
        env:
          MODULES: ${{ github.workspace }}/litedoc4/benchmarks/results/it-modules.txt
        run: |
          set -u
          W="$GITHUB_WORKSPACE"
          EX="$W/litedoc4/extractor/build/extract"
          REPS='${{ github.event.inputs.reps }}'; REPS=${REPS:-2}
          drop() { sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'; }
          now_ms() { echo $(( $(date +%s%N) / 1000000 )); }
          run_ex() { ( cd target && lake env /usr/bin/time -v "$EX" "$MODULES" "$W/ex-$1.jsonl" ) > "$W/ex-$1.log" 2>&1; }

          for r in $(seq 1 "$REPS"); do
            for V in baseline closure oracle; do
              drop
              s=$(now_ms)
              if [ "$V" != baseline ]; then
                "$W/olean-prefetch" -j 16 -m madvise < "$W/set-$V.txt" 2> "$W/pf-$V-$r.json" &
                pf=$!
              else
                pf=""
              fi
              run_ex "$V-$r"
              [ -n "$pf" ] && { wait $pf || true; }
              e=$(now_ms); echo "$(( e - s ))" > "$W/wall-$V-$r.txt"
              echo "$V-$r done ($(( e - s )) ms)"
            done
          done

      - name: Summarise
        if: always()
        run: |
          W="$GITHUB_WORKSPACE"
          {
            cat env-before.txt; echo
            for f in set-closure.txt set-oracle.txt set-blind.txt; do
              [ -e "$f" ] && echo "$f: $(wc -l < $f) files"
            done
            echo
            printf '%-16s %14s %14s %14s %12s\n' variant importModules_us total_us major_faults wall_ms
            for f in "$W"/ex-*.jsonl; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .jsonl); b=${b#ex-}
              imp=$(grep -o '"phase":"[^"]*\.importModules","pid":[0-9]*,"us":[0-9]*' "$f" | grep -o '[0-9]*$')
              tot=$(grep -o '"phase":"[^"]*\.total","pid":[0-9]*,"us":[0-9]*' "$f" | grep -o '[0-9]*$')
              maj=$(grep -o 'Major (requiring I/O) page faults: [0-9]*' "$W/ex-$b.log" 2>/dev/null | grep -o '[0-9]*$')
              wall=$(cat "$W/wall-$b.txt" 2>/dev/null | tr -d '\n')
              printf '%-16s %14s %14s %14s %12s\n' "$b" "${imp:-?}" "${tot:-?}" "${maj:-?}" "${wall:-?}"
            done
            echo
            echo "## prefetcher throughput"
            for f in "$W"/pf-*.json; do echo "$(basename $f): $(cat $f)"; done
          } | tee narrow-summary.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-import-prefetch-narrow
          path: |
            env-before.txt
            set-*.txt
            ex-*.jsonl
            ex-*.log
            pf-*.json
            wall-*.txt
            residency-oracle.jsonl
            narrow-summary.txt
