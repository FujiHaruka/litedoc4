# A measurement, not a gate: its numbers go to benchmarks/results/.
name: multi-version L render memory

on:
  push:
    branches: [multi-version]
    paths:
      - ".github/workflows/mv-l-render.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MV_L_WORK: /home/runner/mv-l
    steps:
      - uses: actions/checkout@v7

      - name: GNU time
        run: sudo apt-get install -y time

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: record the machine
        run: |
          mkdir -p "$MV_L_WORK/logs"
          benchmarks/tools/record-runner.sh "$MV_L_WORK/logs/runner-start.txt"

      - name: litedoc4
        run: |
          tools/build-lean-exe.sh --toolchain-from e2e/micro >"$MV_L_WORK/logs/litedoc4-build.log" 2>&1
          sha256sum .lake/build/bin/litedoc4 | tee "$MV_L_WORK/logs/litedoc4.sha256"

      - name: the store of run 37630692670
        uses: actions/download-artifact@v8
        with:
          name: mv-l-store
          path: /home/runner/mv-l/out/store
          run-id: 37630692670
          github-token: ${{ github.token }}

      - name: (h) experiment -- the floor by phase and by mimalloc option
        run: |
          exp() {
            label="$1"; phase="$2"; shift 2
            rm -rf "$MV_L_WORK/render-exp"
            env LITEDOC4_EXP_PHASE="$phase" "$@" /usr/bin/time -v .lake/build/bin/litedoc4 store render \
              --store "$MV_L_WORK/out/store" --versions v4.32.2,v4.33.0,v4.33.1 --out "$MV_L_WORK/render-exp" \
              >"$MV_L_WORK/logs/exp-$label.out" 2>"$MV_L_WORK/logs/exp-$label.err" || true
            echo "== $label $*"
            grep -E '^exp floor|Maximum resident|Elapsed' "$MV_L_WORK/logs/exp-$label.err"
          }
          exp bytes bytes
          exp inflate inflate
          exp read-default read
          exp read-purge0 read MIMALLOC_PURGE_DELAY=0
          exp read-noarena read MIMALLOC_DISALLOW_ARENA_ALLOC=1
          exp read-noeager read MIMALLOC_ARENA_EAGER_COMMIT=0
          exp full-noarena full MIMALLOC_DISALLOW_ARENA_ALLOC=1

      - name: (i) experiment -- the full render under a 4 GiB cgroup cap, no swap
        run: |
          cap() {
            label="$1"; versions="$2"
            rm -rf "$MV_L_WORK/render-exp"
            status=0
            sudo systemd-run --scope -q -p MemoryMax=4G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" \
              /usr/bin/time -v "$PWD/.lake/build/bin/litedoc4" store render --store "$MV_L_WORK/out/store" \
              --versions "$versions" --out "$MV_L_WORK/render-exp" \
              >"$MV_L_WORK/logs/cap-$label.out" 2>"$MV_L_WORK/logs/cap-$label.err" || status=$?
            echo "== $label ($versions): exit $status"
            grep -E '^exp floor|Maximum resident|Elapsed|signal' "$MV_L_WORK/logs/cap-$label.err" || true
          }
          cap one v4.32.2
          cap three v4.32.2,v4.33.0,v4.33.1

      - name: upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mv-l-render
          path: /home/runner/mv-l/logs
