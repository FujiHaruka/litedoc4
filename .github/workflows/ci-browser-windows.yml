# The site ships no monospace web font (e.g. JuliaMono); it bets that the system
# monospace stack renders what a Lean package's pages contain. macOS and
# `ubuntu-latest` show no missing glyph (measured). Windows is measurable here and
# not on this desk: `windows-latest` ships Consolas *and* Chrome.
#
# Two jobs, because the site has to be built where Lean runs: ubuntu builds the
# e2e fixture's site and uploads it, Windows downloads it and drives Chrome. The
# font check does not read its character set out of the site — it reads
# `benchmarks/tools/mono-charset.json`, the 178 non-ASCII characters of the
# measurement target — so the tiny fixture is enough to judge a font stack.
#
# `workflow_dispatch` only: verification workflows stay off `push`.
name: browser gate on Windows (U3)

on:
  workflow_dispatch:

concurrency:
  # `cancel-in-progress: false`: a double dispatch queues instead of killing the
  # run already measuring.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The incremental state is written and cached but never read back on a
  # throwaway runner.
  CARGO_INCREMENTAL: 0

jobs:
  site:
    name: build the fixture's site (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # `crates/litedoc4-render/build.rs` bundles the site's TypeScript into
      # `app.js`, so cargo cannot build this workspace without node. Pinned
      # rather than left to whatever the runner image ships: the version is the
      # one in `mise.toml`, and `tools/assets-gate.sh` checks that they agree.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Install the toolchain rust-toolchain.toml asks for
        run: rustup show

      # Keyed per job and without `restore-keys` — see the long note in ci.yml.
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v2-${{ runner.os }}-browser-site-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}

      - uses: ./.github/actions/setup-elan

      - name: Build the CLI
        run: cargo build --bin litedoc4

      - name: End to end
        run: tools/e2e-micro.sh --out "$RUNNER_TEMP/e2e" --keep

      # The same gate this job could run itself, run here so that a Windows
      # failure downstream is known to be about Windows and not about the site.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Browser gate (ubuntu, for comparison)
        run: tools/browser-gate.sh "$RUNNER_TEMP/e2e/first/site" --json "$RUNNER_TEMP/browser-ubuntu.json"
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload the site for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: micro-site
          path: ${{ runner.temp }}/e2e/first/site
          if-no-files-found: error

      - name: Upload the ubuntu report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-ubuntu
          path: ${{ runner.temp }}/browser-ubuntu.json
          if-no-files-found: warn

  windows:
    name: browser gate (windows-latest)
    needs: site
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: micro-site
          path: site

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Printed before the gate runs, because "the gate was green" and "the gate
      # ran against Consolas" are different claims and only this step can tell
      # them apart. If Chrome is not at this path the gate says so and exits 2
      # rather than passing.
      - name: Is Chrome where the gate will look
        shell: bash
        run: ls -la "/c/Program Files/Google/Chrome/Application/chrome.exe"

      # `System.Drawing` is not loaded in the runner's PowerShell by default:
      # without `Add-Type` this dies with "Cannot find type
      # [System.Drawing.Text.InstalledFontCollection]".
      - name: What monospace fonts are here
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          (New-Object System.Drawing.Text.InstalledFontCollection).Families |
            Where-Object { $_.Name -match 'Consolas|Cascadia|Courier|Mono' } |
            ForEach-Object { $_.Name }

      - name: Browser gate
        shell: bash
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
        run: tools/browser-gate.sh site --json browser-windows.json

      - name: Upload the Windows report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-windows
          path: browser-windows.json
          if-no-files-found: warn
