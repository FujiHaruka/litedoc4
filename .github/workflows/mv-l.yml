# A measurement, not a gate: its numbers go to benchmarks/results/.
name: multi-version L checkpoint

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  l:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MV_L_WORK: /home/runner/mv-l
      MV_L_ARM: full
      MV_L_TAGS: v4.29.0,v4.29.1,v4.30.0,v4.31.0,v4.32.0,v4.32.1,v4.32.2,v4.33.0,v4.33.1,v4.34.0,v4.34.1
    steps:
      - uses: actions/checkout@v7

      - name: GNU time and gdb
        run: sudo apt-get install -y time gdb

      - name: free disk the run does not use
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: record the machine
        run: |
          mkdir -p "$MV_L_WORK/logs"
          benchmarks/tools/record-runner.sh "$MV_L_WORK/logs/runner-start.txt"

      - name: litedoc4 and Mathlib's releases, the root at the newest
        id: setup
        run: benchmarks/tools/mv-l-run.sh setup

      - name: the releases from nothing, as hosting builds them (full), or once with a stuck reader sampled (probe)
        id: full
        timeout-minutes: ${{ env.MV_L_ARM == 'full' && 320 || 90 }}
        run: benchmarks/tools/mv-l-run.sh "$MV_L_ARM"

      - name: the same build again, nothing left to do
        if: env.MV_L_ARM == 'full'
        timeout-minutes: 20
        run: benchmarks/tools/mv-l-run.sh noop

      - name: served-gate over the site on 127.0.0.1
        if: always() && env.MV_L_ARM == 'full' && steps.full.outcome != 'skipped'
        timeout-minutes: 15
        run: benchmarks/tools/mv-l-run.sh served

      - name: sizes of the store and the site
        if: always() && env.MV_L_ARM == 'full' && steps.full.outcome != 'skipped'
        timeout-minutes: 20
        run: benchmarks/tools/mv-l-run.sh report

      - name: record the machine at the end
        if: always()
        run: |
          df -h > "$MV_L_WORK/logs/df-end.txt"
          free -m >> "$MV_L_WORK/logs/df-end.txt"
          sudo dmesg | grep -iE 'out of memory|killed process|oom' > "$MV_L_WORK/logs/oom.txt" || true
          cat "$MV_L_WORK/logs/df-end.txt" "$MV_L_WORK/logs/oom.txt"

      - name: upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mv-l
          path: /home/runner/mv-l/logs

      - name: upload the store
        if: always() && env.MV_L_ARM == 'full' && steps.full.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: mv-l-store
          path: /home/runner/mv-l/c/store
          retention-days: 30
          compression-level: 0

  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: litedoc4 built in a second job
        run: |
          tools/build-lean-exe.sh --toolchain-from e2e/micro >/dev/null
          sha256sum .lake/build/bin/litedoc4
